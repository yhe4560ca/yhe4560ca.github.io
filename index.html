<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yhe4560ca — Tools</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body {
    margin: 0;
    padding: 48px 20px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 32px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px 0;
  }
  .tools {
    display: grid;
    gap: 14px;
  }
  a.card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .card h2 {
    margin: 0 0 4px 0;
    font-size: 1.05rem;
    color: var(--accent);
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  /* Thumbnails mimic the printed label: always black-on-white, regardless of theme */
  .thumb {
    flex-shrink: 0;
    width: 72px;
    height: 72px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #000;
  }

  .thumb-bin {
    flex-direction: column;
    gap: 4px;
    padding: 8px;
  }

  .thumb-barcode {
    width: 100%;
    height: 16px;
    background: repeating-linear-gradient(90deg, #000 0 2px, transparent 2px 4px);
  }

  .thumb-bin-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }

  .thumb-code {
    font-weight: 700;
    font-size: 7px;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  .thumb-badge {
    background: #000;
    color: #fff;
    font-weight: 700;
    font-size: 7px;
    line-height: 1;
    padding: 3px 4px;
    border-radius: 2px;
  }

  .thumb-pallet {
    flex-direction: column;
    justify-content: space-evenly;
    padding: 8px;
  }

  .thumb-pallet .thumb-line {
    font-weight: 700;
    white-space: nowrap;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tools</h1>
  </header>
  <div class="tools">
    <a class="card" href="tools/bin-label-generator.html">
      <div class="thumb thumb-bin">
        <div class="thumb-barcode"></div>
        <div class="thumb-bin-row">
          <span class="thumb-code">AA11-11-23</span>
          <span class="thumb-badge">AA</span>
        </div>
      </div>
      <div>
        <h2>Bin Label Generator</h2>
        <p>Generate printable 6x4 warehouse bin labels.</p>
      </div>
    </a>
    <a class="card" href="tools/pallet-info-generator.html">
      <div class="thumb thumb-pallet">
        <div class="thumb-line" style="font-size: 7px;">#1234(Y)</div>
        <div class="thumb-line" style="font-size: 6px;">FBY</div>
        <div class="thumb-line" style="font-size: 10px;">08/28</div>
      </div>
      <div>
        <h2>Pallet Info Label Generator</h2>
        <p>Generate printable portrait 4x6 pallet labels.</p>
      </div>
    </a>
  </div>
</main>
</body>
</html>
