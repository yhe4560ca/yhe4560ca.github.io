<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yhe4560ca — Tools</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1a1d23;
    --muted: #5c6370;
    --border: #e2e5ea;
    --accent: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1d2026;
      --text: #eef0f3;
      --muted: #9aa2af;
      --border: #2a2e36;
      --accent: #5b8dfa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 48px 20px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 32px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px 0;
  }
  .tools {
    display: grid;
    gap: 14px;
  }
  a.card {
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .card h2 {
    margin: 0 0 4px 0;
    font-size: 1.05rem;
    color: var(--accent);
  }
  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tools</h1>
  </header>
  <div class="tools">
    <a class="card" href="tools/bin-label-generator.html">
      <h2>Warehouse Bin Label Generator</h2>
      <p>Generate printable 6x4 warehouse bin labels.</p>
    </a>
  </div>
</main>
</body>
</html>
