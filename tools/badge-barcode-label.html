<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Barcode Label Creator — YHECA</title>
    <link rel="stylesheet" href="../assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="../assets/label-tools.js"></script>
    <style>
        /* 6x4 landscape: barcode on top, code and black badge below */
        .label-card {
            width: 6in;
            height: 4in;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }

        .label-divider {
            width: 100%;
            height: 2px;
            background-color: #000;
            border: none;
            margin: 10px 0;
        }

        .code-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .code-text {
            flex-grow: 1;
            min-width: 0;
            text-align: center;
            font-size: 65px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .badge {
            background-color: #000;
            color: #fff;
            padding: 40px 15px;
            border-radius: 8px;
            min-width: 120px;
            flex-shrink: 0;
            box-sizing: border-box;
            text-align: center;
            font-size: 100px;
            font-weight: bold;
            line-height: 1;
        }

        @media print {
            @page {
                size: 6in 4in;
                margin: 0;
            }
        }
    </style>
</head>
<body>
<script src="../assets/nav.js"></script>
<main class="site-main">

    <div class="input-panel">
        <div class="no-print">
            <h2>Badge Barcode Label Creator</h2>
            <label for="codeInput">Enter codes, one per line. The leading letters go in the black badge (e.g., AA11-11-23 → AA):</label>
            <textarea id="codeInput" oninput="renderLabels()" placeholder="AB11-11-23&#10;ZA01-05-02">AB11-11-23
ZA01-05-02</textarea>
            <div class="option-row">
                <label class="option">Barcode height (px):
                    <input type="number" id="heightInput" class="input-field" min="10" max="400" step="5" oninput="renderLabels()">
                </label>
                <label class="option">Bar width (px):
                    <input type="number" id="widthInput" class="input-field" min="0.5" max="10" step="0.5" oninput="renderLabels()">
                </label>
            </div>
            <div class="label-count" id="labelCount"></div>
            <button class="btn-print" onclick="renderAndPrint(renderLabels)">Print Labels</button>
            <div class="error" id="errorMsg"></div>
        </div>
    </div>

    <div id="labels-container"></div>

    <script>
        // Starting value of the Barcode height box, in px (96 px = 1 in). If the barcode is too
        // wide for the label, it shrinks to fit and its height shrinks by the same amount.
        const BARCODE_HEIGHT = 165;
        // Starting value of the Bar width box: thinnest bar in px. Thicker bars stop helping once
        // the barcode reaches the label edge, because it is then scaled down to fit.
        const BAR_WIDTH = 6;

        function renderLabels() {
            const container = document.getElementById('labels-container');
            const issues = createIssues();
            const height = readNumber('heightInput', BARCODE_HEIGHT);
            const width = readNumber('widthInput', BAR_WIDTH);
            container.replaceChildren();

            const codes = readLines('codeInput');
            showCount('labelCount', plural(codes.length, 'label'));

            codes.forEach(code => {
                const card = el('div', 'label-card');
                container.appendChild(card);

                addBarcode(card, code, { width, height, margin: 10 }, issues);
                card.appendChild(el('hr', 'label-divider'));

                const badge = (code.match(/^[A-Za-z]+/) || [''])[0];
                const row = el('div', 'code-row');
                row.appendChild(el('div', 'code-text', code));
                row.appendChild(el('div', 'badge', badge));
                card.appendChild(row);
                checkFits(card, code, issues);
            });

            showIssues('errorMsg', issues);
        }

        document.getElementById('heightInput').value = BARCODE_HEIGHT;
        document.getElementById('widthInput').value = BAR_WIDTH;
        renderLabels();
    </script>

</main>
<script src="../assets/fit-preview.js"></script>
</body>
</html>
