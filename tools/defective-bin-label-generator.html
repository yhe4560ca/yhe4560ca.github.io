<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defective Bin Label Creator — YHECA</title>
    <link rel="stylesheet" href="../assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        body {
            margin: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .no-print {
            max-width: 600px;
            margin: 0 auto 30px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .error {
            color: #d93025;
            font-size: 14px;
            margin-top: 10px;
        }

        #labels-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* 4x6 portrait sheet holding 4 stacked labels */
        .label-page {
            border: 1px dashed #999;
            width: 4in;
            height: 6in;
            background: white;
            color: #000;
            box-sizing: border-box;
            padding: 0.2in;
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: repeat(4, 1fr);
            gap: 0.1in;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .label {
            border: 1px dashed #ccc;
            border-radius: 4px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .location-title {
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            max-width: 55%;
            overflow-wrap: break-word;
        }

        /* Barcode scales down first; the name only wraps once it hits its max width */
        .barcode {
            min-width: 0;
            max-width: 65%;
            height: auto;
        }

        @media print {
            @page {
                size: 4in 6in;
                margin: 0;
            }

            body {
                margin: 0;
                background: white;
            }

            .no-print {
                display: none;
            }

            #labels-container {
                gap: 0;
            }

            .label-page {
                border: none;
                box-shadow: none;
                page-break-after: always;
            }

            .label {
                border: none;
            }
        }
    </style>
</head>
<body>
<script src="../assets/nav.js"></script>
<main class="site-main">

    <div class="no-print">
        <h2>Defective Bin Label Creator</h2>
        <label for="locationInput">Enter locations (one per line, 4 per sheet):</label>
        <textarea id="locationInput" oninput="renderLabels()" placeholder="location_1&#10;location_2&#10;location_3&#10;location_4">location_1
location_2
location_3
location_4</textarea>
        <div class="button-group">
            <button class="btn-generate" onclick="renderLabels()">Generate</button>
            <button class="btn-print" onclick="generateAndPrint()">Print</button>
        </div>
        <div class="error" id="errorMsg"></div>
    </div>

    <div id="labels-container"></div>

    <script>
        const LABELS_PER_PAGE = 4;
        // Narrowest bar (one barcode module) most scanners read reliably: 7.5 mil
        const MIN_MODULE_INCHES = 0.0075;
        const BAR_WIDTH = 2;

        function renderLabels() {
            const input = document.getElementById('locationInput').value;
            const lines = input.split('\n').map(line => line.trim()).filter(line => line !== '');
            const container = document.getElementById('labels-container');
            const failed = [];
            const tooSmall = [];

            container.innerHTML = '';

            for (let start = 0; start < lines.length; start += LABELS_PER_PAGE) {
                const page = document.createElement('div');
                page.className = 'label-page';
                container.appendChild(page);

                lines.slice(start, start + LABELS_PER_PAGE).forEach(text => {
                    const labelDiv = document.createElement('div');
                    labelDiv.className = 'label';

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'location-title';
                    titleDiv.textContent = text;

                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.classList.add('barcode');

                    labelDiv.appendChild(titleDiv);
                    labelDiv.appendChild(svg);
                    page.appendChild(labelDiv);

                    // CODE128 rejects some characters; skip the barcode instead of aborting the rest
                    try {
                        JsBarcode(svg, text, {
                            format: 'CODE128',
                            width: BAR_WIDTH,
                            height: 45,
                            displayValue: false,
                            margin: 0
                        });
                        // The barcode shrinks to fit the label; check its bars stay wide enough to scan
                        const modules = svg.width.baseVal.value / BAR_WIDTH;
                        const moduleInches = svg.getBoundingClientRect().width / modules / 96;
                        if (moduleInches < MIN_MODULE_INCHES) tooSmall.push(text);
                    } catch (e) {
                        svg.remove();
                        failed.push(text);
                    }
                });
            }

            const messages = [];
            if (failed.length) messages.push(`Could not create barcode for: ${failed.join(', ')}`);
            if (tooSmall.length) messages.push(`Barcode too small to scan reliably, shorten the name: ${tooSmall.join(', ')}`);
            document.getElementById('errorMsg').innerHTML = '';
            messages.forEach(m => {
                const line = document.createElement('div');
                line.textContent = m;
                document.getElementById('errorMsg').appendChild(line);
            });
        }

        function generateAndPrint() {
            renderLabels();
            window.print();
        }

        renderLabels();
    </script>

</main>
<script src="../assets/fit-preview.js"></script>
</body>
</html>
