<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Barcode Label Creator — YHECA</title>
    <link rel="stylesheet" href="../assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="../assets/label-tools.js"></script>
    <style>
        /* Double: 4x6 portrait, two codes, one on the top half and one on the bottom */
        .label-card {
            width: 4in;
            height: 6in;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.3in;
            text-align: center;
        }

        /* Single: 6x4 landscape, one code */
        .label-card.landscape {
            width: 6in;
            height: 4in;
        }

        /* Each half keeps its space, so a lone last code stays on the top half */
        .item-block {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .code-text {
            font-size: 28px;
            font-weight: bold;
        }

        .label-divider {
            width: 100%;
            border-top: 2px dashed #000;
            margin: 10px 0;
        }
    </style>
    <!-- Print page size, set by renderLabels() to match the chosen layout -->
    <style id="pageSize"></style>
</head>
<body>
<script src="../assets/nav.js"></script>
<main class="site-main">

    <div class="input-panel">
        <div class="no-print">
            <h2>Double Barcode Label Creator</h2>
            <label class="option">Layout:
                <select id="layoutInput" class="input-field" onchange="renderLabels()">
                    <option value="double">Double — 2 per label, portrait 4x6</option>
                    <option value="single">Single — 1 per label, landscape 6x4</option>
                </select>
            </label>
            <label for="codeInput">Enter codes, one per line:</label>
            <textarea id="codeInput" oninput="renderLabels()" placeholder="WO-001&#10;WO-002">WO-001
WO-002</textarea>
            <div class="option-row">
                <label class="option">Barcode height (px):
                    <input type="number" id="heightInput" class="input-field" min="10" max="400" step="5" oninput="renderLabels()">
                </label>
                <label class="option">Bar width (px):
                    <input type="number" id="widthInput" class="input-field" min="0.5" max="10" step="0.5" oninput="renderLabels()">
                </label>
            </div>
            <div class="label-count" id="labelCount"></div>
            <button class="btn-print" onclick="renderAndPrint(renderLabels)">Print Labels</button>
            <div class="error" id="errorMsg"></div>
        </div>
    </div>

    <div id="labels-container"></div>

    <script>
        // Codes per label and print page size for each layout
        const LAYOUTS = {
            double: { perLabel: 2, pageSize: '4in 6in' },
            single: { perLabel: 1, pageSize: '6in 4in' },
        };
        // Starting value of the Barcode height box, in px (96 px = 1 in). If the barcode is too
        // wide for the label, it shrinks to fit and its height shrinks by the same amount.
        const BARCODE_HEIGHT = 135;
        // Starting value of the Bar width box: thinnest bar in px. Thicker bars stop helping once
        // the barcode reaches the label edge, because it is then scaled down to fit.
        const BAR_WIDTH = 3;

        function renderLabels() {
            const container = document.getElementById('labels-container');
            const issues = createIssues();
            const height = readNumber('heightInput', BARCODE_HEIGHT);
            const width = readNumber('widthInput', BAR_WIDTH);
            container.replaceChildren();

            const layoutName = document.getElementById('layoutInput').value;
            const layout = LAYOUTS[layoutName];
            document.getElementById('pageSize').textContent =
                `@media print { @page { size: ${layout.pageSize}; margin: 0; } }`;

            const codes = readLines('codeInput');
            showCount('labelCount', `${plural(codes.length, 'code')} on ${plural(Math.ceil(codes.length / layout.perLabel), 'label')}`);

            for (let start = 0; start < codes.length; start += layout.perLabel) {
                const card = el('div', layoutName === 'single' ? 'label-card landscape' : 'label-card');
                container.appendChild(card);

                for (let i = 0; i < layout.perLabel; i++) {
                    if (i) card.appendChild(el('div', 'label-divider'));
                    const block = el('div', 'item-block');
                    card.appendChild(block);
                    const code = codes[start + i];
                    if (code === undefined) continue;
                    block.appendChild(el('div', 'code-text', code));
                    addBarcode(block, code, { width, height, margin: 10 }, issues);
                }
                checkFits(card, codes.slice(start, start + layout.perLabel).join(' / '), issues);
            }

            showIssues('errorMsg', issues);
        }

        document.getElementById('heightInput').value = BARCODE_HEIGHT;
        document.getElementById('widthInput').value = BAR_WIDTH;
        renderLabels();
    </script>

</main>
<script src="../assets/fit-preview.js"></script>
</body>
</html>
