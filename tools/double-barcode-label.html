<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Barcode Label Creator — YHECA</title>
    <link rel="stylesheet" href="../assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="../assets/label-tools.js"></script>
    <style>
        /* 4x6 portrait: the same code printed twice, top and bottom */
        .label-card {
            width: 4in;
            height: 6in;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 0.3in;
            text-align: center;
        }

        .item-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .code-text {
            font-size: 28px;
            font-weight: bold;
        }

        .label-divider {
            width: 100%;
            border-top: 2px dashed #000;
            margin: 10px 0;
        }

        @media print {
            @page {
                size: 4in 6in;
                margin: 0;
            }
        }
    </style>
</head>
<body>
<script src="../assets/nav.js"></script>
<main class="site-main">

    <div class="input-panel">
        <div class="no-print">
            <h2>Double Barcode Label Creator</h2>
            <label for="codeInput">Enter codes, one per line (each prints twice on one label):</label>
            <textarea id="codeInput" oninput="renderLabels()" placeholder="WO-001&#10;WO-002">WO-001
WO-002</textarea>
            <div class="label-count" id="labelCount"></div>
            <button class="btn-print" onclick="renderAndPrint(renderLabels)">Print Labels</button>
            <div class="error" id="errorMsg"></div>
        </div>
    </div>

    <div id="labels-container"></div>

    <script>
        function renderLabels() {
            const container = document.getElementById('labels-container');
            const issues = createIssues();
            container.replaceChildren();

            const codes = readLines('codeInput');
            showCount('labelCount', plural(codes.length, 'label'));

            codes.forEach(code => {
                const card = el('div', 'label-card');
                container.appendChild(card);

                [0, 1].forEach(i => {
                    if (i) card.appendChild(el('div', 'label-divider'));
                    const block = el('div', 'item-block');
                    card.appendChild(block);
                    block.appendChild(el('div', 'code-text', code));
                    // Report each code once, not once per copy
                    addBarcode(block, code, { width: 2.5, height: 70, margin: 10 }, i ? createIssues() : issues);
                });
            });

            showIssues('errorMsg', issues);
        }

        renderLabels();
    </script>

</main>
<script src="../assets/fit-preview.js"></script>
</body>
</html>
