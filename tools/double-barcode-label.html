<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Barcode Label Creator — YHECA</title>
    <link rel="stylesheet" href="../assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script src="../assets/label-tools.js"></script>
    <style>
        /* 4x6 portrait: two codes, one on the top half and one on the bottom */
        .label-card {
            width: 4in;
            height: 6in;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.3in;
            text-align: center;
        }

        /* Each half keeps its space, so a lone last code stays on the top half */
        .item-block {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .code-text {
            font-size: 28px;
            font-weight: bold;
        }

        .label-divider {
            width: 100%;
            border-top: 2px dashed #000;
            margin: 10px 0;
        }

        @media print {
            @page {
                size: 4in 6in;
                margin: 0;
            }
        }
    </style>
</head>
<body>
<script src="../assets/nav.js"></script>
<main class="site-main">

    <div class="input-panel">
        <div class="no-print">
            <h2>Double Barcode Label Creator</h2>
            <label for="codeInput">Enter codes, one per line (2 per label):</label>
            <textarea id="codeInput" oninput="renderLabels()" placeholder="WO-001&#10;WO-002">WO-001
WO-002</textarea>
            <label class="option">Barcode height (px):
                <input type="number" id="heightInput" class="input-field" min="10" max="400" step="5" oninput="renderLabels()">
            </label>
            <div class="label-count" id="labelCount"></div>
            <button class="btn-print" onclick="renderAndPrint(renderLabels)">Print Labels</button>
            <div class="error" id="errorMsg"></div>
        </div>
    </div>

    <div id="labels-container"></div>

    <script>
        const CODES_PER_LABEL = 2;
        // Starting value of the Barcode height box, in px (96 px = 1 in). If the barcode is too
        // wide for the label, it shrinks to fit and its height shrinks by the same amount.
        const BARCODE_HEIGHT = 70;

        function renderLabels() {
            const container = document.getElementById('labels-container');
            const issues = createIssues();
            const height = readNumber('heightInput', BARCODE_HEIGHT);
            container.replaceChildren();

            const codes = readLines('codeInput');
            showCount('labelCount', `${plural(codes.length, 'code')} on ${plural(Math.ceil(codes.length / CODES_PER_LABEL), 'label')}`);

            for (let start = 0; start < codes.length; start += CODES_PER_LABEL) {
                const card = el('div', 'label-card');
                container.appendChild(card);

                [0, 1].forEach(i => {
                    if (i) card.appendChild(el('div', 'label-divider'));
                    const block = el('div', 'item-block');
                    card.appendChild(block);
                    const code = codes[start + i];
                    if (code === undefined) return;
                    block.appendChild(el('div', 'code-text', code));
                    addBarcode(block, code, { width: 2.5, height: height, margin: 10 }, issues);
                });
                checkFits(card, codes.slice(start, start + CODES_PER_LABEL).join(' / '), issues);
            }

            showIssues('errorMsg', issues);
        }

        document.getElementById('heightInput').value = BARCODE_HEIGHT;
        renderLabels();
    </script>

</main>
<script src="../assets/fit-preview.js"></script>
</body>
</html>
