<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WO Bin Label Generator</title>
    <link rel="stylesheet" href="../assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        body {
            margin: 20px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .no-print {
            max-width: 600px;
            margin: 0 auto 30px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        #labels-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .label-card {
            border: 1px dashed #999;
            width: 4in;
            height: 6in;
            background: white;
            color: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            box-sizing: border-box;
            padding: 0.3in;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }

        @media print {
            body { background: none; margin: 0; }
            .no-print { display: none; }
            .label-card { page-break-after: always; border: none !important; box-shadow: none; }
        }

        @page {
            size: 4in 6in;
            margin: 0;
        }

        .item-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wo-text {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .barcode-section {
            margin: 5px 0;
        }

        .label-divider {
            width: 100%;
            border-top: 2px dashed #000;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="no-print">
        <a class="back-link" href="../index.html">&larr; Back to Tools</a>
        <h2>WO Bin Label Generator</h2>
        <label for="dataInput">Enter Work Orders (one per line, e.g., 1, 2):</label>
        <textarea id="dataInput" placeholder="1&#10;2">1
2</textarea>
        <button class="btn-generate" onclick="generateLabels()">Generate &amp; Print</button>
    </div>

    <div id="labels-container"></div>

    <script>
        function generateLabels() {
            const input = document.getElementById('dataInput').value;
            const lines = input.split('\n').map(item => item.trim()).filter(item => item !== '');
            const container = document.getElementById('labels-container');
            container.innerHTML = '';

            // One label sheet per WO, with the same WO printed twice (top and bottom)
            lines.forEach((num, i) => {
                const wo = `WO-${num.padStart(3, '0')}`;

                const id1 = `barcode-1-${i}`;
                const id2 = `barcode-2-${i}`;

                const labelDiv = document.createElement('div');
                labelDiv.className = 'label-card';
                labelDiv.innerHTML = `
                    <div class="item-block">
                        <div class="wo-text">${wo}</div>
                        <div class="barcode-section">
                            <svg id="${id1}"></svg>
                        </div>
                    </div>

                    <div class="label-divider"></div>

                    <div class="item-block">
                        <div class="wo-text">${wo}</div>
                        <div class="barcode-section">
                            <svg id="${id2}"></svg>
                        </div>
                    </div>
                `;

                container.appendChild(labelDiv);

                // Render Barcodes
                JsBarcode(`#${id1}`, wo, { format: "CODE128", width: 2.5, height: 70, displayValue: false });
                JsBarcode(`#${id2}`, wo, { format: "CODE128", width: 2.5, height: 70, displayValue: false });
            });

            window.print();
        }

        window.onload = function() {
            generateLabels();
        };
    </script>

</body>
</html>
