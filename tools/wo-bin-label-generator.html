<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>4x6 Label Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .no-print {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 14px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        @media print {
            body { background: none; margin: 0; }
            .no-print { display: none; }
            .label { page-break-after: always; border: none !important; }
        }

        .label {
            width: 4in;
            height: 6in;
            padding: 0.3in;
            box-sizing: border-box;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            border: 1px dashed #ccc;
            margin: 0 auto;
            text-align: center;
        }

        @page {
            size: 4in 6in;
            margin: 0;
        }

        .item-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wo-text {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .barcode-section {
            margin: 5px 0;
        }
        
        .divider {
            width: 100%;
            border-top: 2px dashed #000;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h2>4x6 Label Generator</h2>
        <p>Enter Work Orders (one per line, e.g., 1, 2):</p>
        <textarea id="dataInput" placeholder="1&#10;2">1
2</textarea>
        <br>
        <button onclick="generateLabels()">Generate & Print</button>
    </div>

    <div id="labelContainer"></div>

    <script>
        function generateLabels() {
            const input = document.getElementById('dataInput').value;
            const lines = input.split('\n').map(item => item.trim()).filter(item => item !== '');
            const container = document.getElementById('labelContainer');
            container.innerHTML = '';

            // Group lines into pairs (2 items per label)
            for (let i = 0; i < lines.length; i += 2) {
                const num1 = lines[i];
                const num2 = lines[i+1] || lines[i]; // fallback if odd number of items

                const wo1 = `WO-${num1.padStart(3, '0')}`;
                const wo2 = `WO-${num2.padStart(3, '0')}`;
                
                const id1 = `barcode-1-${i}`;
                const id2 = `barcode-2-${i}`;

                const labelDiv = document.createElement('div');
                labelDiv.className = 'label';
                labelDiv.innerHTML = `
                    <div class="item-block">
                        <div class="wo-text">${wo1}</div>
                        <div class="barcode-section">
                            <svg id="${id1}"></svg>
                        </div>
                    </div>
                    
                    <div class="divider"></div>

                    <div class="item-block">
                        <div class="wo-text">${wo2}</div>
                        <div class="barcode-section">
                            <svg id="${id2}"></svg>
                        </div>
                    </div>
                `;
                
                container.appendChild(labelDiv);

                // Render Barcodes
                JsBarcode(`#${id1}`, wo1, { format: "CODE128", width: 2.5, height: 70, displayValue: false });
                JsBarcode(`#${id2}`, wo2, { format: "CODE128", width: 2.5, height: 70, displayValue: false });
            }

            window.print();
        }

        window.onload = function() {
            generateLabels();
        };
    </script>

</body>
</html>
